<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life-ERP — Sem Conexão</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white flex items-center justify-center min-h-screen p-4">
    <div class="text-center max-w-sm p-6 rounded-2xl bg-white/5 border border-white/10">
        <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            ⚡
        </div>
        <h1 class="text-lg font-bold mb-2">Você está offline</h1>
        <p class="text-xs text-slate-400 mb-6">Verifique sua conexão com a internet para sincronizar suas atividades e XP.</p>
        <button onclick="window.location.reload()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold">Tentar Novamente</button>
    </div>
</body>
</html>
